name: Deploy Interactive Simulator to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'interactive_betting_simulator.html'
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy:
    name: Deploy to Hostinger via SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify file exists
        run: |
          if [[ ! -f "interactive_betting_simulator.html" ]]; then
            echo "❌ interactive_betting_simulator.html not found in repo root"
            exit 1
          fi
          echo "✅ File found: $(wc -c < interactive_betting_simulator.html) bytes"

      - name: Deploy to Hostinger via SFTP
        uses: appleboy/sftp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "interactive_betting_simulator.html"
          target: "${{ secrets.HOSTINGER_TARGET_DIR }}/simulator/index.html"
          rm: false
          overwrite: true

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully"
          echo "🌐 Live at: https://${{ secrets.HOSTINGER_DOMAIN }}/simulator/"
          echo "📁 Deployed to: ${{ secrets.HOSTINGER_TARGET_DIR }}/simulator/index.html"

# Permisos mínimos necesarios
permissions:
  contents: read