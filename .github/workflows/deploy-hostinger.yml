name: Deploy Interactive Simulator to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'interactive_betting_simulator.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger via SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH key format
        run: |
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /dev/null && echo "✅ Key válida" || echo "❌ Key INVÁLIDA"

      - name: Test SSH connection
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "echo 'SSH OK' && ls ${{ secrets.HOSTINGER_TARGET_DIR }}/"

      - name: Deploy via SFTP
        uses: appleboy/sftp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "interactive_betting_simulator.html"
          target: "${{ secrets.HOSTINGER_TARGET_DIR }}/simulator/index.html"
          rm: false
          overwrite: true

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed"
          echo "🌐 Live at: https://${{ secrets.HOSTINGER_DOMAIN }}/simulator/"

permissions:
  contents: read