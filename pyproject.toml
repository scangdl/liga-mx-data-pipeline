[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liga-mx-pipeline"
version = "0.3.0"
description = "Pipeline de datos y paper trading para Liga MX"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Armando Sánchez Cendejas"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "optuna>=3.4.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "pandera>=0.18.0",
    "mlflow>=2.9.0",
    "evidently>=0.4.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "black>=23.12.0",
    "isort>=5.13.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.entry-points]
console_scripts = { "liga_mx_update" = "liga_mx.cli.commands:update_cmd", "liga_mx_predict" = "liga_mx.cli.commands:predict_cmd", "liga_mx_train" = "liga_mx.cli.commands:train_cmd", "liga_mx_trade" = "liga_mx.cli.commands:trade_cmd", "liga_mx_decay" = "liga_mx.cli.commands:decay_cmd", "liga_mx_backtest" = "liga_mx.cli.commands:backtest_cmd", "liga_mx_fetch" = "liga_mx.cli.commands:fetch_cmd" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["liga_mx*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM102", "SIM103"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=liga_mx --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/liga_mx"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
